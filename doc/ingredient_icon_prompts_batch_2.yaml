batch_instruction: >
  Generate 16 separate 512x512 PNG images, exactly one image per item.
  Use each item's filename exactly. Do not create a collage, contact sheet, sprite sheet,
  comparison board, or multi-panel image. Keep visual style and apparent scale consistent
  across all 16 images.

