# 食材图标批次 1/4
batch_instruction: >
  Generate 16 separate 512x512 PNG images, exactly one image per item.
  Use each item's filename exactly. Do not create a collage, contact sheet, sprite sheet,
  comparison board, or multi-panel image. Keep visual style and apparent scale consistent
  across all 16 images.

items:
  - filename: rice_seed.png
    prompt: >
      512x512 game ingredient inventory icon, isolated single ingredient subject, hand-drawn simple 2D
      illustration, thick dark-brown outline, rounded cute shapes, warm natural pastel colors, simple but not
      empty, a few clear interior details, clean readable silhouette, slightly top-down 3/4 view, cozy cooking
      game UI icon. Center the subject and make it fit comfortably inside one centered cell of an invisible 4x4
      grid; do not draw the grid. Leave generous transparent padding on every side. Transparent PNG background
      preferred. If transparency is unavailable, use one perfectly flat solid chroma-key light cyan background
      (#DDF8F5), with no texture, gradient, or shadow. A tiny unbranded kraft-paper seed pouch with several pale
      golden rice grains visible at the opening, a simple rice-ear pictogram on the pouch, no text, one compact
      centered icon. Avoid: photorealistic, 3D render, realistic food photography, thin outline, messy sketch,
      complex scene, kitchen, farm landscape, table surface, basket, decorative frame, branded packaging, readable
      label, text, Chinese characters, numbers, watermark, logo, visible grid, UI frame, gradient background,
      textured background, cast shadow, drop shadow, glow, multiple unrelated ingredients, recipe dish, cooked
