# 生产场地图标 ImageGen 批量提示词
batch_instruction: >
  Generate 4 separate 512x512 PNG images, exactly one image per item.
  Use each item's filename exactly. Do not create a collage, contact sheet, sprite sheet,
  comparison board, or multi-panel image. Keep the visual style, viewing angle, outline weight,
  miniature scale, and detail density consistent across all 4 images.

items:
  - filename: farm.png
    prompt: >
      512x512 game production-site icon, isolated single miniature location vignette,
      hand-drawn simple 2D illustration, thick dark-brown outline, rounded cute shapes,
      warm natural pastel colors, simple but not empty, a few clear environmental details,
      clean readable silhouette, slightly top-down 3/4 isometric view, cozy farming and cooking game UI icon.
      The site must sit on one small irregular rounded patch of ground that is part of the icon,
      with no surrounding landscape or rectangular background tile.
      Center the subject inside a wide 3x2-cell footprint within an invisible 4x4 inventory grid;
      do not draw the grid. Leave generous transparent padding on every side.
      Transparent PNG background preferred. If transparency is unavailable, use one perfectly flat
      solid chroma-key light cyan background (#DDF8F5), with no texture, gradient, horizon, floor, or shadow.
      Draw a compact cheerful farm on a warm-brown soil patch: four short curved tilled rows with only tiny
      generic green sprouts, a small cream toolshed with a muted coral roof, one short wooden fence segment,
      a simple water barrel attached beside the shed, and a narrow dirt path connecting the elements.
      Keep every feature joined into one unified miniature silhouette. The site is clean, quiet, organized,
      and immediately recognizable as a crop-growing farm without showing any harvest-ready ingredient.
      Avoid: photorealistic, 3D render, realistic landscape painting, thin outline, messy sketch,
      huge panorama, distant scenery, sky, clouds, sun, mountains, horizon, full rectangular terrain tile,
      rice grains, wheat ears, beans, pumpkins, fruit, seed bags, harvested crops, food, finished recipe,
      people, farmer, animals, tractor, complex machinery, floating objects, separate props,
      readable sign, text, Chinese characters, numbers, watermark, logo, visible grid, UI frame,
      gradient background, textured background, cast shadow, drop shadow, reflection, glow,
      cropped site, disconnected ground pieces, excessive detail, low contrast.

